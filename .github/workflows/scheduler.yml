name: Apartment Hunter Scheduler

on:
  workflow_dispatch:

concurrency:
  group: apartment-hunter-scheduler
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger scheduler endpoint
        run: |
          curl --fail --request GET \
            --header "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/scheduler/run"
