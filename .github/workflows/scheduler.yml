name: Apartment Hunter Scheduler

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: apartment-hunter-scheduler
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger scheduler endpoint
        run: |
          curl --fail --request POST \
            --header "Authorization: Bearer ${{ secrets.SCHEDULER_SECRET }}" \
            "${{ secrets.APP_URL }}/api/scheduler/run"
