# Production stack for a single VPS: app (Next.js + Playwright/Chromium),
# Postgres, Caddy (automatic HTTPS) and a lightweight scheduler trigger.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Values come from a local `.env` file (see .env.production.example).
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-apartment_hunter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-apartment_hunter}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-apartment_hunter} -d ${POSTGRES_DB:-apartment_hunter}"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Overrides any DATABASE_URL in .env: always point at the compose service.
      DATABASE_URL: postgresql://${POSTGRES_USER:-apartment_hunter}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-apartment_hunter}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      APP_UPSTREAM: app:3000
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

  # Triggers the listing scan on an interval (replaces Vercel Cron).
  # Errors never crash the loop; the app logs scheduler failures itself.
  scheduler:
    image: curlimages/curl:latest
    restart: unless-stopped
    environment:
      APP_URL: http://app:3000
      CRON_SECRET: ${CRON_SECRET:?set CRON_SECRET in .env}
      INTERVAL_SECONDS: ${SCHEDULER_INTERVAL_SECONDS:-900}
    entrypoint:
      - /bin/sh
      - -c
      - 'while true; do sleep "$$INTERVAL_SECONDS"; curl -fsS -X POST -H "Authorization: Bearer $$CRON_SECRET" "$$APP_URL/api/scheduler/run" >/dev/null 2>&1 || true; done'
    depends_on:
      - app

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
